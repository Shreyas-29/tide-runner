<body>
<canvas id="c"></canvas>
<div id="hud" class="pre">

</div>
<div id="curtain"><b>OPEN OCEAN</b><div class="pb"><div id="pb"></div></div><span id="cs">setting the sky</span></div>
<div id="title"><b>OPEN OCEAN</b><span>every wave, cloud and rivet written in code</span></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">Open Ocean needs JavaScript and WebGL 2.</p></noscript>
